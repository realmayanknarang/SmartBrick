name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: ${{ matrix.package }} tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package:
          - client
          - server

    defaults:
      run:
        working-directory: ${{ matrix.package }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        run: npm install

      # Cache the mongodb-memory-server binary so Render/CI doesn't re-download
      # it on every run. The binary is pinned to 7.0.14 in package.json.
      - name: Cache mongodb-memory-server binary
        if: matrix.package == 'server'
        uses: actions/cache@v4
        with:
          path: server/.cache/mongodb-binaries
          key: mongodb-binary-7.0.14
          restore-keys: mongodb-binary-

      - name: Run tests
        run: npm test
        env:
          # Ensure the binary is downloaded into the cached path
          MONGOMS_DOWNLOAD_DIR: .cache/mongodb-binaries
          # Pin the version so it never tries to resolve a different one
          MONGOMS_VERSION: "7.0.14"
          # Disable MD5 checksum verification to speed up CI
          MONGOMS_MD5_CHECK: "0"

  client-build:
    name: client build
    runs-on: ubuntu-latest
    needs: test

    defaults:
      run:
        working-directory: client

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build client
        run: npm run build
