<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartBrick — Procurement Intelligence for Builders</title>

    <!-- SEO — Phase 6B -->
    <meta
      name="description"
      content="SmartBrick gives construction teams real-time demand forecasting, vendor scoring, and supply-risk alerts — so nothing stalls your build."
    />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type"        content="website" />
    <meta property="og:title"       content="SmartBrick — Procurement Intelligence for Builders" />
    <meta property="og:description" content="End-to-end procurement intelligence for every site you run. Demand forecasting, vendor scoring, and risk alerts in one platform." />
    <meta property="og:url"         content="https://smartbrick.app/" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="SmartBrick — Procurement Intelligence for Builders" />
    <meta name="twitter:description" content="End-to-end procurement intelligence for every site you run." />

    <!-- Google Fonts: preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      STK Bureau Serif  (--font-bureau-serif): editorial serif — display & headings 28px+.
      STK Bureau Sans   (--font-bureau-sans):  UI grotesque — all body text and UI.
      STK Gerhard       (--font-gerhard):       eyebrow labels — 14px all-caps only.
      These are licensed fonts. Google Fonts substitutes loaded below:
        DM Serif Display → closest optical match for STK Bureau Serif
        Inter            → closest match for STK Bureau Sans (300, 400, 500, 600, 700)
      Replace these links with self-hosted @font-face rules once you have the
      licensed STK font files. Full guidance in /design.md.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
