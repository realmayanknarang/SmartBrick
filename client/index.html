<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartBrick — Procurement Intelligence for Builders</title>

    <!-- SEO — Phase 6B -->
    <meta
      name="description"
      content="SmartBrick gives construction teams real-time demand forecasting, vendor scoring, and supply-risk alerts — so nothing stalls your build."
    />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type"        content="website" />
    <meta property="og:title"       content="SmartBrick — Procurement Intelligence for Builders" />
    <meta property="og:description" content="End-to-end procurement intelligence for every site you run. Demand forecasting, vendor scoring, and risk alerts in one platform." />
    <meta property="og:url"         content="https://smartbrick.app/" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="SmartBrick — Procurement Intelligence for Builders" />
    <meta name="twitter:description" content="End-to-end procurement intelligence for every site you run." />

    <!-- Google Fonts: preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      Recoleta (--font-recoleta): editorial serif — display and headings 36px+.
      DM Serif Display is the closest Google Fonts substitute for Recoleta.
      Oldschool Grotesk (--font-oldschool-grotesk): self-hosted if available;
      Inter is used as the Google Fonts fallback at matching weights (300, 400).
      Full font guidance in /design.md.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400&display=swap"
      rel="stylesheet"
    />

    <!--
      NOTE: If you have licensed Recoleta and Oldschool Grotesk, add @font-face
      declarations in tokens.css or a dedicated fonts.css and remove the
      DM Serif Display / Inter fallback links above.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
